// Only this mapping controls which panel is displayed in each slot.
// Set a slot to null to omit the panel. Removed panel markup is also safe.
const PANEL_LAYOUT=Object.freeze({top:'build',left:'game',right:'test',bottom:'runtime'});
function applyPanelLayout(layout){
 const slotNames=['top','left','right','bottom'];
 const slots=new Map(Array.from(document.querySelectorAll('[data-panel-slot]'),el=>[el.dataset.panelSlot,el]));
 const panels=new Map(Array.from(document.querySelectorAll('[data-panel-id]'),el=>[el.dataset.panelId,el]));
 const used=new Set();
 for(const slotName of slotNames){
  if(!slots.has(slotName))throw new Error('Missing panel slot: '+slotName);
  const key=layout[slotName];
  if(key==null)continue;
  if(!['build','game','test','runtime'].includes(key)||used.has(key))
   throw new Error('Unknown or repeated panel: '+key);
  used.add(key);
 }
 // Must run before module initialization: moving a live WebGL canvas is avoided.
 for(const slot of slots.values())slot.replaceChildren();
 for(const slotName of slotNames){
  const key=layout[slotName],slot=slots.get(slotName),panel=panels.get(key);
  slot.dataset.panel=panel?key:'empty';
  if(panel)slot.appendChild(panel);
 }
 for(const [key,panel] of panels)if(!used.has(key))panel.remove();
 const main=document.querySelector('.landscape-main');
 if(main)main.dataset.visiblePanels=String(['left','right'].filter(s=>slots.get(s).dataset.panel!=='empty').length);
}
applyPanelLayout(PANEL_LAYOUT);

(async function () {
  const hash = document.getElementById('github-commit');
  const time = document.getElementById('github-commit-time');
  if (!hash || !time) return;
  const categories = ['forest', 'matsudo', 'common'];
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 6000);
  // Saved descriptions and live commit metadata are independent fetches.
  // A GitHub API failure must not erase the saved descriptions.
  const infoRequest = fetch('./development-info.json', {cache:'no-store'})
    .then(response => { if (!response.ok) throw new Error('development-info HTTP '+response.status); return response.json(); });
  const commitRequest = fetch('https://api.github.com/repos/shuma-fujita1012/komorebi/commits/main', {
    headers:{Accept:'application/vnd.github+json'},cache:'no-store',signal:controller.signal
  }).then(response => { if (!response.ok) throw new Error('GitHub HTTP '+response.status); return response.json(); });
  const [infoResult, commitResult] = await Promise.allSettled([infoRequest, commitRequest]);
  clearTimeout(timeout);
  const info = infoResult.status === 'fulfilled' ? infoResult.value : null;
  for (const category of categories) {
    const target = document.getElementById('dev-'+category);
    const value = info && info[category];
    if (target && typeof value === 'string' && value.trim()) target.textContent = value.trim();
  }
  const engine = document.getElementById('dev-engine');
  if (engine && info && typeof info.engine === 'string' && /^[a-f0-9]{7,40}$/i.test(info.engine))
    engine.textContent = info.engine;
  if (commitResult.status !== 'fulfilled') {
    hash.textContent = 'GitHub main最新：取得できません';
    time.textContent = '最終コミット：取得できません';
    return;
  }
  try {
    const commit = commitResult.value;
    const sha = typeof commit.sha === 'string' ? commit.sha.slice(0,7) : null;
    const iso = commit.commit && (commit.commit.committer?.date || commit.commit.author?.date);
    if (!sha || !iso || Number.isNaN(new Date(iso).getTime())) throw new Error('コミット情報なし');
    const jst = new Intl.DateTimeFormat('ja-JP', {
      timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',
      day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false
    }).format(new Date(iso));
    hash.textContent = 'GitHub main最新：' + sha;
    time.textContent = '最終コミット：' + jst + ' JST';
    // Only the newest commit determines which headings receive 🆕.
    // Check the subject and body, allowing multiple category lines in one commit.
    const message = String(commit.commit?.message || '');
    const changed = new Set();
    for (const line of message.split(/\r?\n/)) {
      const match = /^\s*(forest|matsudo|common):\s*\S/i.exec(line);
      if (match) changed.add(match[1].toLowerCase());
    }
    for (const category of categories) {
      const badge = document.getElementById('dev-'+category+'-new');
      const description = document.getElementById('dev-'+category);
      if (badge) badge.hidden = !(info && changed.has(category) && description &&
        description.textContent.trim() !== '更新履歴なし');
    }
  } catch (_) {
    hash.textContent = 'GitHub main最新：取得できません';
    time.textContent = '最終コミット：取得できません';
  }
})();

  matsudoNpcStressSelected=false;
  
  miniMapVisible=false;gameView?.setMapVisible(false);setRenderMode('B');
  if(name==='matsudo'){
   // Start facing west across town and allow flight before the map is ready.
   cameraRig.state.pitch=0;
   cameraRig.state.yaw=Math.PI/2;
   publishRuntimeStatus('status','🏙️ 松戸：地図読み込み中（飛行できます）');
   publishRuntimeStatus('label-status','🏙️ 屋上名：地図読み込み中');
   // Give the renderer an opportunity to show the helicopter before map work begins.
   requestAnimationFrame(()=>setTimeout(()=>{
    if(generation===worldGeneration&&activeWorld==='matsudo')void loadMatsudoMapInBackground(generation);
   },0));
  }else {publishRuntimeStatus('status','🌳 森にワープしました');publishRuntimeStatus('label-status','🏙️ 屋上名：森ワールドでは非表示');}
  // Persist the selected world; map loading is independent of flight.
  try{localStorage.setItem(SAVED_WORLD_KEY,name)}catch(_){/* storage unavailable */}
  publishGameState();return true;
 }catch(error){
  publishRuntimeStatus('status','ワープ失敗：'+String(error.message||error));
  throw error;
 }finally{warpInProgress=false;}
}
let rendererA=null,rendererB=null,loadingA=null,loadingB=null;
let okA=false,okB=false,renderMode='B';
let last=0,start=0,frames=0;
function ensureA(){
 if(!gameView)return Promise.resolve();
 if(okA)return Promise.resolve();
 if(loadingA)return loadingA;
 publishRuntimeStatus('ea','A：Engine WebGLを読み込み中…');
 loadingA=(async()=>{
  const instance=await createRenderer('A',{profile:'mesh'});
  await instance.initialize({canvas:gameView.canvasA});
  rendererA=instance;okA=true;publishRuntimeStatus('ea','');
  publishRuntimeStatus('renderer-status','🎨 Engine Renderer A準備OK'+(okB?' / B準備OK':''));
  publishRuntimeStatus('status','Renderer A描画準備完了');
 })().catch(error=>{
  loadingA=null;publishRuntimeStatus('ea','A初期化エラー：'+String(error.message||error));
  publishRuntimeStatus('renderer-status','🎨 Renderer A初期化失敗');
  if(renderMode==='A'||renderMode==='compare')setRenderMode('B');
 });
 return loadingA;
}
function ensureB(){
 if(!gameView)return Promise.resolve();
 if(okB)return Promise.resolve();
 if(loadingB)return loadingB;
 publishRuntimeStatus('eb','B：Engine Three.jsを読み込み中…');
 loadingB=(async()=>{
  const instance=await createRenderer('B',{profile:'mesh'});
  await instance.initialize({canvas:gameView.canvasB});
  rendererB=instance;okB=true;publishRuntimeStatus('eb','');
  publishRuntimeStatus('renderer-status','🎨 Engine Renderer B準備OK'+(okA?' / A準備OK':''));
  publishRuntimeStatus('status','Renderer B描画準備完了');
  const diagnostic=document.getElementById('launch-diagnostic');
  if(diagnostic)diagnostic.textContent='診断：Engine Input・Camera・Renderer準備完了';
 })().catch(error=>{
  loadingB=null;publishRuntimeStatus('eb','B初期化エラー：'+String(error.message||error));
  publishRuntimeStatus('renderer-status','🎨 Renderer B初期化失敗');
  if(renderMode==='B'||renderMode==='compare')setRenderMode('A');
 });
 return loadingB;
}
function setRenderMode(mode){
 if(!['A','B','compare'].includes(mode))mode='B';
 renderMode=mode;
 const a=mode!=='B',b=mode!=='A';
 gameView?.setRenderMode(mode);
 try{localStorage.setItem('komorebi3d-render-mode-dev',mode)}catch(e){}
 if(gameView&&a&&!okA)ensureA();
 if(gameView&&b&&!okB)ensureB();
 publishGameState();
}
let initialMode='B';
try{initialMode=localStorage.getItem('komorebi3d-render-mode-dev')||'B'}catch(e){}
setRenderMode(initialMode);
// Early Game API boundary: future controllers depend on this object, not panel DOM.
const gameApi=Object.freeze({
 getState(){
  return {
   ...core.getState(),houseLevel,renderMode,worldId:activeWorld,flightAltitude:activeWorld==='matsudo'?flightAltitude:0,
   npcCount:activeWorld==='forest'?npcManager.agents.length:(matsudoNpcStressSelected?1000:0),npcVisible:activeWorld==='forest'?npcManager.visibleCount:0,
   npcDrawn:activeWorld==='forest'?npcManager.drawCount:0,npcRenderLimit:npcManager.maxDrawn,
   npcRenderDistance:npcManager.maxDrawDistance,mapVisible:miniMapVisible,
   status:Object.fromEntries(runtimeStatusValues)
  };
 },
 subscribe(listener){
  if(typeof listener!=='function')throw new TypeError('Game API listener must be a function');
  gameStateListeners.add(listener);
  return ()=>gameStateListeners.delete(listener);
 },
 reset:resetGameForTest,setRenderMode,setNpcCount,setNpcRenderLimit,setNpcRenderDistance,
 setMapVisible:setMiniMapVisible,teleport:teleportToTestSpot,setWorld
});
// Panel views subscribe to Game API without controlling each other.
const unmountRuntimeStatusPanel=mountRuntimeStatusPanel(document.querySelector('.runtime-status'),gameApi);

const unmountTestControlsPanel=mountTestControlsPanel(document.querySelector('#test-ops-panel'),gameApi);
// Reparent existing nodes only; Game API subscriptions and canvases survive edits.
mountPanelLayoutEditor(document,PANEL_LAYOUT,{preserveSlotSize:true});
function frame(t){
 const dt=Math.min(2,(t-last)/16.67||1);last=t;
 const commands=readEngineInput(),oldX=game.x,oldZ=game.z;
 update(dt,commands);
 if(Math.hypot(commands.moveX,commands.moveY)>.06){
  const moved=Math.hypot(game.x-oldX,game.z-oldZ);
  publishRuntimeStatus('collision-status',moved<.001?'● 移動停止（障害物または地面端）':'● 移動中（壁沿い移動も確認）');
 }
 publishRuntimeStatus('pos',activeWorld==='matsudo'?`X ${game.x.toFixed(1)} / Z ${game.z.toFixed(1)} / 🚁 高度 ${flightAltitude.toFixed(1)}m`:`X ${game.x.toFixed(1)} / Z ${game.z.toFixed(1)} / ${houseLevel===2?'2階':houseLevel===1?'1階':cafeInside?'カフェ店内':'屋外'}`);
 publishRuntimeStatus('edge',(()=>{const b=groundSystem.getBounds(),r=collisionSystem.characterRadius;return game.x<=b.minX+r+.01||game.x>=b.maxX-r-.01||game.z<=b.minZ+r+.01||game.z>=b.maxZ-r-.01})()?'● 地面の端':'● 境界内');
 // HUD updates are independent of the GPU renderer, so failures remain diagnosable.
 if(activeWorld==='matsudo'){
  try{
   if(matsudoLabels){
    const hudPose=cameraRig.getPose({x:game.x,z:game.z},0);
    const labelStats=matsudoLabels.update({...hudPose,fovDegrees:45},{x:game.x,y:flightAltitude,z:game.z});
    publishRuntimeStatus('label-status',`🏙️ 屋上名：データ ${labelStats.total} / 200m以内 ${labelStats.inRange} / 画面内 ${labelStats.inView} / 表示 ${labelStats.shown}`);
   }else publishRuntimeStatus('label-status','🏙️ 屋上名：松戸ラベルレイヤー未作成');
  }catch(error){publishRuntimeStatus('label-status','🏙️ 屋上名：描画診断エラー '+String(error.message||error));}
 }
 // When the game panel is removed, keep simulation state but pause GPU drawing.
 if(gameView?.canvasB.isConnected){
  try{
   const snapshot=productRenderSnapshot();
   if(renderMode!=='B'&&okA)rendererA.render(snapshot);
   if(renderMode!=='A'&&okB)rendererB.render(snapshot);
   const a=renderMode!=='B'&&okA?rendererA.lastFrameId:'―';
   const b=renderMode!=='A'&&okB?rendererB.lastFrameId:'―';
   publishRuntimeStatus('sync-status','共通Snapshot #'+snapshot.frameId+' / A:'+a+' / B:'+b+
     (renderMode==='compare'&&okA&&okB?(a===b?' / 同期OK':' / 同期ずれ'):''));
  }catch(error){
   publishRuntimeStatus('renderer-status','🎨 描画エラー：'+String(error.message||error));
   console.error(error);
  }
 }
 frames++;
 if(t-start>1000){
  const fps=Math.round(frames*1000/(t-start));
  publishRuntimeStatus('fps','FPS '+fps);
  publishRuntimeStatus('npc-status','🐹 全'+(activeWorld==='forest'?npcManager.agents.length:0)+'匹 / 視界内'+npcManager.visibleCount+' / 距離内候補'+npcManager.candidatesInRange+' / 3D表示'+npcManager.drawCount+' / 上限'+npcManager.maxDrawn);
  start=t;frames=0;
 }
 if(miniMapVisible&&t-lastMiniMapFrame>=200){paintDebugMap();lastMiniMapFrame=t;}
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// Startup has completed: restore the last world, or remain in the Forest.
let savedWorld='forest';
try{if(localStorage.getItem(SAVED_WORLD_KEY)==='matsudo')savedWorld='matsudo'}catch(_){/* storage unavailable */}
if(savedWorld==='matsudo')setWorld('matsudo').catch(()=>setWorld('forest').catch(()=>{}));
function pauseProductInput(){inputManager.pause();core.rotate({direction:0,phase:'hold'});last=0;}
function resumeProductInput(){inputManager.resume();last=0;}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseProductInput();else resumeProductInput();});
window.addEventListener('blur',pauseProductInput);
window.addEventListener('focus',()=>{if(!document.hidden)resumeProductInput();});
// Keep initialized GL resources when Safari stores this page in its back/forward cache.
window.addEventListener('pagehide',pauseProductInput);
window.addEventListener('pageshow',()=>{if(!document.hidden)resumeProductInput();});
</script></body></html>
