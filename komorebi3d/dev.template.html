// Only this mapping controls which panel is displayed in each slot.
// Set a slot to null to omit the panel. Removed panel markup is also safe.
const PANEL_LAYOUT=Object.freeze({top:'build',left:'game',right:'test',bottom:'runtime'});
function applyPanelLayout(layout){
 const slotNames=['top','left','right','bottom'];
 const slots=new Map(Array.from(document.querySelectorAll('[data-panel-slot]'),el=>[el.dataset.panelSlot,el]));
 const panels=new Map(Array.from(document.querySelectorAll('[data-panel-id]'),el=>[el.dataset.panelId,el]));
 const used=new Set();
 for(const slotName of slotNames){
  if(!slots.has(slotName))throw new Error('Missing panel slot: '+slotName);
  const key=layout[slotName];
  if(key==null)continue;
  if(!['build','game','test','runtime'].includes(key)||used.has(key))
   throw new Error('Unknown or repeated panel: '+key);
  used.add(key);
 }
 // Must run before module initialization: moving a live WebGL canvas is avoided.
 for(const slot of slots.values())slot.replaceChildren();
 for(const slotName of slotNames){
  const key=layout[slotName],slot=slots.get(slotName),panel=panels.get(key);
  slot.dataset.panel=panel?key:'empty';
  if(panel)slot.appendChild(panel);
 }
 for(const [key,panel] of panels)if(!used.has(key))panel.remove();
 const main=document.querySelector('.landscape-main');
 if(main)main.dataset.visiblePanels=String(['left','right'].filter(s=>slots.get(s).dataset.panel!=='empty').length);
}
applyPanelLayout(PANEL_LAYOUT);

(function () {

      time.textContent = '最終コミット：取得できません';

function hiddenPart(name){if(cafeInside&&name==='cafe-roof')return true;if(!houseLevel)return false;if(['roof','chimney'].includes(name))return true;return houseLevel===1&&['interior-upper-floor','interior-bedroom','interior-bedroom-rug'].includes(name);}

let renderFrameId=0;
function productRenderSnapshot(){
 const pose=cameraRig.getPose({x:game.x,z:game.z},0);
 const objects=renderParts.map((p,i)=>({
   id:p.name+":"+i,geometry:engineMeshes[i],
   position:p.name==='avatar'?[game.x,characterY,game.z]:p.name==='hamster'?[hamsterNpc.drawX,0,hamsterNpc.drawZ]:p.offset,

   opacity:wallOpacity(p.name),visible:p.name==='hamster'?npcManager.primaryDrawn===1:!hiddenPart(p.name)
 }));
 // Reuse Tree v2's geometry at Tree v1's former position, without duplicating its mesh.
 const v2Index=renderParts.findIndex(p=>p.name==='tree-v2');
 if(v2Index>=0)objects.push({id:'tree-v2-original-spot',geometry:engineMeshes[v2Index],position:[-7,0,-5],yaw:0,opacity:1,visible:true});
 // Only nearby visible extras, limited by the draw-count slider, reach Renderer A or B.
 for(const a of npcManager.drawCandidates){
  objects.push({id:'npc:'+a.id,geometry:hamsterLiteGeometry,
   position:[a.drawX,0,a.drawZ],yaw:a.drawYaw,opacity:1,visible:true});
 }
 return createMeshRenderSnapshot({
  frameId:++renderFrameId,
  camera:{eye:pose.eye,target:pose.target,fovDegrees:45,near:.1,far:220},
  objects
 });

let rendererA=null,rendererB=null,loadingA=null,loadingB=null;
let okA=false,okB=false,renderMode='B';
let last=0,start=0,frames=0;
function ensureA(){
 if(!gameView)return Promise.resolve();
 if(okA)return Promise.resolve();
 if(loadingA)return loadingA;
 publishRuntimeStatus('ea','A：Engine WebGLを読み込み中…');
 loadingA=(async()=>{
  const instance=await createRenderer('A',{profile:'mesh'});
  await instance.initialize({canvas:gameView.canvasA});
  rendererA=instance;okA=true;publishRuntimeStatus('ea','');
  publishRuntimeStatus('renderer-status','🎨 Engine Renderer A準備OK'+(okB?' / B準備OK':''));
  publishRuntimeStatus('status','Renderer A描画準備完了');
 })().catch(error=>{
  loadingA=null;publishRuntimeStatus('ea','A初期化エラー：'+String(error.message||error));
  publishRuntimeStatus('renderer-status','🎨 Renderer A初期化失敗');
  if(renderMode==='A'||renderMode==='compare')setRenderMode('B');
 });
 return loadingA;
}
function ensureB(){
 if(!gameView)return Promise.resolve();
 if(okB)return Promise.resolve();
 if(loadingB)return loadingB;
 publishRuntimeStatus('eb','B：Engine Three.jsを読み込み中…');
 loadingB=(async()=>{
  const instance=await createRenderer('B',{profile:'mesh'});
  await instance.initialize({canvas:gameView.canvasB});
  rendererB=instance;okB=true;publishRuntimeStatus('eb','');
  publishRuntimeStatus('renderer-status','🎨 Engine Renderer B準備OK'+(okA?' / A準備OK':''));
  publishRuntimeStatus('status','Renderer B描画準備完了');
  const diagnostic=document.getElementById('launch-diagnostic');
  if(diagnostic)diagnostic.textContent='診断：Engine Input・Camera・Renderer準備完了';
 })().catch(error=>{
  loadingB=null;publishRuntimeStatus('eb','B初期化エラー：'+String(error.message||error));
  publishRuntimeStatus('renderer-status','🎨 Renderer B初期化失敗');
  if(renderMode==='B'||renderMode==='compare')setRenderMode('A');
 });
 return loadingB;
}
function setRenderMode(mode){
 if(!['A','B','compare'].includes(mode))mode='B';
 renderMode=mode;
 const a=mode!=='B',b=mode!=='A';
 gameView?.setRenderMode(mode);
 try{localStorage.setItem('komorebi3d-render-mode-dev',mode)}catch(e){}
 if(gameView&&a&&!okA)ensureA();
 if(gameView&&b&&!okB)ensureB();
 publishGameState();
}
let initialMode='B';
try{initialMode=localStorage.getItem('komorebi3d-render-mode-dev')||'B'}catch(e){}
setRenderMode(initialMode);
// Early Game API boundary: future controllers depend on this object, not panel DOM.
const gameApi=Object.freeze({
 getState(){
  return {
   ...core.getState(),houseLevel,renderMode,
   npcCount:npcManager.agents.length,npcVisible:npcManager.visibleCount,
   npcDrawn:npcManager.drawCount,npcRenderLimit:npcManager.maxDrawn,
   npcRenderDistance:npcManager.maxDrawDistance,mapVisible:miniMapVisible,
   testWarning,status:Object.fromEntries(runtimeStatusValues)
  };
 },
 subscribe(listener){
  if(typeof listener!=='function')throw new TypeError('Game API listener must be a function');
  gameStateListeners.add(listener);
  return ()=>gameStateListeners.delete(listener);
 },
 reset:resetGameForTest,setRenderMode,setNpcCount,setNpcRenderLimit,setNpcRenderDistance,
 setMapVisible:setMiniMapVisible,teleport:teleportToTestSpot
});
// Panel views subscribe to Game API without controlling each other.
const unmountRuntimeStatusPanel=mountRuntimeStatusPanel(document.querySelector('.runtime-status'),gameApi);

const unmountTestControlsPanel=mountTestControlsPanel(document.querySelector('#test-ops-panel'),gameApi);
// Reparent existing nodes only; Game API subscriptions and canvases survive edits.
mountPanelLayoutEditor(document,PANEL_LAYOUT,{preserveSlotSize:true});
let slowRenderWindows=0;
function frame(t){
 const dt=Math.min(2,(t-last)/16.67||1);last=t;
 const commands=readEngineInput(),oldX=game.x,oldZ=game.z;
 update(dt,commands);
 if(Math.hypot(commands.moveX,commands.moveY)>.06){
  const moved=Math.hypot(game.x-oldX,game.z-oldZ);
  publishRuntimeStatus('collision-status',moved<.001?'● 移動停止（障害物または地面端）':'● 移動中（壁沿い移動も確認）');
 }
 publishRuntimeStatus('pos',`X ${game.x.toFixed(1)} / Z ${game.z.toFixed(1)} / ${houseLevel===2?'2階':houseLevel===1?'1階':cafeInside?'カフェ店内':'屋外'}`);
 publishRuntimeStatus('edge',(()=>{const b=groundSystem.getBounds(),r=collisionSystem.characterRadius;return game.x<=b.minX+r+.01||game.x>=b.maxX-r-.01||game.z<=b.minZ+r+.01||game.z>=b.maxZ-r-.01})()?'● 地面の端':'● 境界内');
 // When the game panel is removed, keep simulation state but pause GPU drawing.
 if(gameView?.canvasB.isConnected){
  try{
   const snapshot=productRenderSnapshot();
   if(renderMode!=='B'&&okA)rendererA.render(snapshot);
   if(renderMode!=='A'&&okB)rendererB.render(snapshot);
   const a=renderMode!=='B'&&okA?rendererA.lastFrameId:'―';
   const b=renderMode!=='A'&&okB?rendererB.lastFrameId:'―';
   publishRuntimeStatus('sync-status','共通Snapshot #'+snapshot.frameId+' / A:'+a+' / B:'+b+
     (renderMode==='compare'&&okA&&okB?(a===b?' / 同期OK':' / 同期ずれ'):''));
  }catch(error){
   publishRuntimeStatus('renderer-status','🎨 描画エラー：'+String(error.message||error));
   console.error(error);
  }
 }
 frames++;
 if(t-start>1000){
  const fps=Math.round(frames*1000/(t-start));
  publishRuntimeStatus('fps','FPS '+fps);
  publishRuntimeStatus('npc-status','🐹 全'+npcManager.agents.length+'匹 / 視界内'+npcManager.visibleCount+' / 距離内候補'+npcManager.candidatesInRange+' / 3D表示'+npcManager.drawCount+' / 上限'+npcManager.maxDrawn);
  // If a stress test becomes extremely slow, lower the requested rendering budget.
  slowRenderWindows=(npcManager.agents.length===1000&&npcManager.drawCount>65&&fps<12)?slowRenderWindows+1:0;
  if(slowRenderWindows>=2){
   const safe=Math.max(65,Math.floor(npcManager.drawCount*.60));
   npcManager.maxDrawn=safe;
   testWarning='⚠️ '+fps+'FPSが続いたため、描画上限を'+safe+'匹に自動調整しました。';
   publishGameState();
   slowRenderWindows=0;
  }
  start=t;frames=0;
 }
 if(miniMapVisible&&t-lastMiniMapFrame>=200){paintDebugMap();lastMiniMapFrame=t;}
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function pauseProductInput(){inputManager.pause();core.rotate({direction:0,phase:'hold'});last=0;}

window.addEventListener('pagehide',pauseProductInput);
