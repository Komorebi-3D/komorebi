name: Check generated panel pages
# TEMPORARY: disable automatic checks during GitHub Actions / Pages incident.
# Restore push and pull_request triggers after isolation is complete.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generated-file-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check komorebi3d/build-dev.mjs
      - run: node --check komorebi3d/dev-panel-layout.js
      - run: node komorebi3d/build-dev.mjs --check
      - run: node komorebi3d/build-mock-panel.mjs --check
