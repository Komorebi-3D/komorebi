name: Refresh Matsudo OSM snapshot
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/matsudo-osm.yml'
      - 'komorebi3d/maps/fetch-map.py'
  schedule:
    - cron: '20 3 1 * *'
permissions:
  contents: write
jobs:
  download-map:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download real Matsudo OSM data
        run: python komorebi3d/maps/fetch-map.py
      - name: Commit verified static snapshot only if changed
        run: |
          git add komorebi3d/maps/data/matsudo.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh Matsudo 500m OpenStreetMap snapshot"
            # Other development commits may land while the API download runs.
            # Replay just the generated snapshot commit over the newest main.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "main moved during push; retrying ($attempt/5)"
              sleep 3
            done
            echo "Unable to push verified OSM snapshot after retries"
            exit 1
          fi
